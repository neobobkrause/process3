# Process3's own required check, "ci", on every pull request: the tool's tests once, on Node 22
# (the shims' default for a product's runners, cfg .node // "22"; PD-21), across the runner's
# cores. The record check is the required check "record", record-pr.yml's job, judged by the
# base's tool under pull_request_target; it is not repeated here.
# Retargeting a pull request (edited, with a base change) runs the tests again. Any other edit (a
# title or body) runs them only when no green run of the same head on the same base is cached:
# a red or unfinished run is never stood on. A diff that touches only DECISIONS*.md and notes/
# (none of which any test reads; notes/r17c-settings.md is read, so it is excluded) runs none.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: a green run of this head on this base
        id: green
        if: github.event.action == 'edited' && !github.event.changes.base
        uses: actions/cache/restore@v4
        with:
          path: ci-green
          key: ci-green-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.base.sha }}
          lookup-only: true
      - name: what to run
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GREEN: ${{ steps.green.outputs.cache-hit }}
        run: |
          if [ "$GREEN" = "true" ]; then echo "an edit of title or body: this head on this base already ran green; no tests"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE...$HEAD_SHA")
          other=$( { printf '%s\n' "$files" | grep -v -E '^(DECISIONS[^/]*\.md|notes/.*)$' ; printf '%s\n' "$files" | grep -x 'notes/r17c-settings.md' ; } || true )
          if [ -n "$files" ] && [ -z "$other" ]; then echo "only DECISIONS*.md and notes/ changed; no test reads them; no tests"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.run == 'true'
        with:
          node-version: 22
      - name: tool tests, Node 22
        if: steps.plan.outputs.run == 'true'
        run: node --test --test-concurrency="$(nproc)" 'tool/test/*.test.mjs'
      - name: remember this green run
        if: steps.plan.outputs.run == 'true'
        run: mkdir -p ci-green && echo "${{ github.event.pull_request.head.sha }}" > ci-green/sha
      - uses: actions/cache/save@v4
        if: steps.plan.outputs.run == 'true'
        with:
          path: ci-green
          key: ci-green-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.base.sha }}
