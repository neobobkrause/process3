# Process3's own required check, "ci", on every pull request: the tool's tests on Node 22 and
# 26 (at once, in this one job), then the record check (REC-9, REC-10, approvals). The record
# check runs the BASE's tool against the head, so a change cannot rewrite the check that judges it. Retargeting a pull
# request (edited) runs it again.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Both versions in this one job, at once (ci headroom, 5 Nov: in turn they took ~7 of the
      # job's 10 minutes). One job named ci, no matrix: a matrix renames the required check.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node 22's path
        run: echo "NODE22=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Node 26's path
        run: echo "NODE26=$(command -v node)" >> "$GITHUB_ENV"
      - name: tool tests, Node 22 and Node 26 at once
        run: |
          n=$(nproc)
          for v in 22 26; do
            bin=NODE$v
            ( start=$(date +%s); rc=0; "${!bin}" --test --test-concurrency="$n" 'tool/test/*.test.mjs' > "$RUNNER_TEMP/node$v.log" 2>&1 || rc=$?; echo "$rc $(( $(date +%s) - start ))" > "$RUNNER_TEMP/node$v.rc" ) &
          done
          wait
          fail=0
          for v in 22 26; do
            bin=NODE$v
            rc=1; secs=0; [ -f "$RUNNER_TEMP/node$v.rc" ] && read -r rc secs < "$RUNNER_TEMP/node$v.rc"
            echo "::group::Node $v ($("${!bin}" --version)): exit $rc in $secs s"
            cat "$RUNNER_TEMP/node$v.log"
            echo "::endgroup::"
            { grep -E '^(ℹ|#) (tests|pass|fail) ' "$RUNNER_TEMP/node$v.log" || true; } | tr '\n' ' '; echo "(Node $v, $secs s)"
            [ "$rc" = 0 ] || { echo "::error::tool tests failed on Node $v (exit $rc)"; fail=1; }
          done
          exit "$fail"
      - name: record check, by the base's tool
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git worktree add -q --detach "$RUNNER_TEMP/base" "$BASE"
          tool="$RUNNER_TEMP/base/tool/p3.mjs"
          if [ ! -f "$tool" ]; then echo "::warning::the base has no tool yet; the head's tool runs (bootstrap only: removing the tool is a finding)"; tool=tool/p3.mjs; fi
          node "$tool" record-check --base "$BASE" --head "$HEAD_SHA" --branch "$HEAD_REF" --out record-findings.json
